name: Build StudyBuddy AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Prepare app logo
        run: |
          mkdir -p assets
          cp file_000000007560821188420cd21ea96764.png assets/icon.png

      - name: Create Android project
        run: npx cap add android

      - name: Generate app icons
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#17142f'

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyBuddy-AI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
